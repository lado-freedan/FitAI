

services:
  db:
    image: postgres:15-alpine
    container_name: fitai_postgres
    volumes:
      - fitai_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"

  redis:
    image: redis:7-alpine
    container_name: fitai_redis
    ports:
      - "6380:6379"

  web:
    build: .
    container_name: fitai_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    container_name: fitai_celery_worker
    command: sh -c "PYTHONPATH=. celery -A core worker --loglevel=info"
    volumes:
      - .:/app
      - media_volume:/app/media
    depends_on:
      - db
      - redis
    environment:
      - DEBUG=1

volumes:
  fitai_postgres_data:
  media_volume: