

services:
  db:
    image: postgres:15-alpine
    container_name: fitai_postgres
    volumes:
      - fitai_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=fitai_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
    ports:
      - "5435:5432"

  redis:
    image: redis:7-alpine
    container_name: fitai_redis
    ports:
      - "6380:6379"

  web:
    build: .
    container_name: fitai_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  fitai_postgres_data: